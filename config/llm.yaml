# llm.yaml — LLM 问答式解题器配置（阶段0 附加实验，--brain llm 启用）
# brain: stub   → 离线桩联调（无需网络/密钥，可注入畸形率测兜底路径）
# brain: openai → OpenAI 兼容端点（base_url + api_key_env 环境变量 + model）

brain: stub

base_url: "https://api.deepseek.com/v1"   # OpenAI 兼容端点，stub 模式忽略
api_key_env: "LLM_API_KEY"                # 密钥只从环境变量读，不入库
model: "deepseek-chat"
temperature: 0.7
timeout_s: 20

ask_retries: 2          # 畸形/非法输出纠错重问次数（超出 → 随机合法格兜底）

stub_error_rate: 0.05   # 桩模拟畸形输出概率（eval_m4 --stub-error-rate 可加压）
stub_seed: 20260910
